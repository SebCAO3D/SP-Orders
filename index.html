<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#002f6c">
<meta name="color-scheme" content="light">
<title>Commandes – Service Point</title>
<style>
  :root {
    --nuit: #002f6c;
    --jaune: #f8c200;
    --action: #0052cc;
    --action-clair: #e6efff;
    --fond: #f1f3f7;
    --carte: #ffffff;
    --texte: #14213d;
    --discret: #5b6678;
    --trait: #d5dbe6;
    --erreur: #c62828;
    --ok: #1b7f3b;
    --alerte: #b26a00;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  button, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---- En-tête ---- */
  .head {
    background: var(--nuit);
    color: #fff;
    border-bottom: 4px solid var(--jaune);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .head img { height: 60px; width: auto; max-width: 50%; object-fit: contain; flex: none; }
  .headtext { flex: 1; min-width: 0; text-align: right; line-height: 1.35; }
  .headtitle { font-weight: 800; font-size: 0.9rem; }
  .headmeta { font-size: 0.8rem; color: #cfdcf3; }
  .headmeta b { color: #fff; font-weight: 800; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  h2 { margin: 18px 0 10px; font-size: 1.05rem; font-weight: 800; letter-spacing: 0.01em; }
  h2:first-child { margin-top: 4px; }

  /* ---- Lieu de livraison ---- */
  .places { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .places.single { grid-template-columns: 1fr; }
  .place {
    position: relative;
    background: var(--carte);
    border: 2px solid var(--trait);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
    min-height: 132px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .place.on { border-color: var(--action); background: var(--action-clair); }
  .place.on::after {
    content: "✓";
    position: absolute; top: 0; right: 0;
    width: 28px; height: 28px;
    background: var(--action); color: #fff;
    border-radius: 0 9px 0 28px;
    font-weight: 800; font-size: 0.8rem;
    text-align: right; padding: 2px 6px 0 0;
  }
  .place-btn {
    width: 100%;
    background: none; border: 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 0; min-height: 44px;
    cursor: pointer;
  }
  .place svg { width: 34px; height: 34px; stroke: var(--nuit); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico-slot { display: flex; align-items: center; justify-content: center; min-height: 38px; }
  .place .logo { max-height: 150px; max-width: 100%; width: auto; height: auto; object-fit: contain; mix-blend-mode: multiply; }
  .ico-slot.has-logo { margin-top: 14px; }
  .place .t { font-weight: 800; color: var(--nuit); }
  .place .s { font-size: 0.8rem; color: var(--discret); }
  .place select {
    width: 100%;
    margin-top: 8px;
    min-height: 40px;
    border: 0;
    border-radius: 8px;
    background: #e3e6ec;
    padding: 0 8px;
    font-size: 0.9rem;
  }
  .place.on select { background: #fff; border: 1px solid #b9cdf3; }

  /* ---- Choix du pneu ---- */
  .pick { position: relative; }
  .pickbox {
    background: var(--carte);
    border: 2px solid var(--trait);
    border-radius: 12px;
    padding: 12px 40px 12px 14px;
    min-height: 74px;
  }
  .pickbox .name { font-weight: 800; line-height: 1.3; }
  .pickbox .placeholder { color: var(--discret); font-weight: 600; }
  .pickbox .chev { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--discret); pointer-events: none; }
  .pickbox { cursor: pointer; }
  .pick select { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .pick:focus-within .pickbox, .pickbox:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  .panel { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--carte); border: 2px solid var(--action); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,30,80,.25); overflow: hidden; }
  .panel[hidden] { display: none; }
  .panel input { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--trait); padding: 14px; font: inherit; font-size: 16px; outline: none; }
  .panel .list { max-height: min(55vh, 380px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .panel .grp { padding: 8px 14px 4px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--discret); background: #f4f6fa; }
  .panel .opt { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #eef1f6; padding: 10px 14px; font: inherit; cursor: pointer; color: inherit; }
  .panel .opt:hover, .panel .opt:focus-visible, .panel .opt.act { background: #eaf1ff; outline: none; }
  .panel .opt .n { font-weight: 700; }
  .panel .opt .m { font-size: 12px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
  .panel .opt[disabled] { opacity: .5; cursor: not-allowed; }
  .panel .none { padding: 14px; color: var(--discret); }
  .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-size: 0.85rem; }
  .livr { margin-top: 3px; font-size: 13px; font-weight: 700; color: var(--ok); }
  .reco { background: #fff1b8; border-radius: 4px; padding: 1px 6px; font-weight: 700; }

  /* ---- Quantité ---- */
  .qty { display: flex; justify-content: center; align-items: stretch; margin: 14px auto 0; width: 230px; max-width: 100%; }
  .qty button {
    width: 64px; height: 56px; border: 0;
    background: var(--action); color: #fff;
    font-size: 1.9rem; font-weight: 700; line-height: 1;
    cursor: pointer;
  }
  .qty button:first-child { border-radius: 10px 0 0 10px; }
  .qty button:last-child { border-radius: 0 10px 10px 0; }
  .qty input {
    flex: 1; min-width: 0; width: 100%; padding: 0; margin: 0;
    text-align: center; font: inherit; font-size: 1.7rem; font-weight: 800; color: var(--texte);
    background: #fff; border: 0; border-top: 2px solid var(--trait); border-bottom: 2px solid var(--trait); border-radius: 0;
  }

  /* ---- Bandeaux ---- */
  .banner { border-radius: 8px; padding: 12px 14px; margin-top: 14px; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
  .banner.dup, .banner.error { background: #c62828; color: #fff; }
  .banner.closed { background: #fff6d6; color: #5c4600; border: 2px solid var(--jaune); }
  .banner .ico { font-size: 1.1rem; line-height: 1.3; }

  /* ---- Bouton ajouter ---- */
  .add {
    width: 100%; min-height: 58px; margin-top: 16px;
    border: 0; border-radius: 30px;
    background: var(--action); color: #fff;
    font-size: 1rem; font-weight: 800; letter-spacing: 0.02em;
    cursor: pointer;
  }
  .add:disabled { background: #9db6e3; cursor: not-allowed; }
  .why { text-align: center; color: var(--discret); font-size: 0.9rem; margin: 8px 0 0; min-height: 1.3em; }

  /* ---- Panier / lignes ---- */
  .card { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 4px 14px; }
  .lieu-title { font-weight: 800; color: var(--nuit); padding: 12px 0 2px; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--trait); align-items: center; }
  .lieu-title + .line { border-top: 0; }
  .line .name { font-weight: 700; }
  .line .meta { color: var(--discret); font-size: 0.85rem; }
  .mini { display: flex; align-items: center; gap: 6px; }
  .mini button { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--trait); background: #fff; font-size: 1.3rem; font-weight: 700; cursor: pointer; }
  .mini button:disabled { opacity: 0.4; }
  .mini output { min-width: 2.2ch; text-align: center; font-weight: 800; font-size: 1.1rem; }
  .mini .del { color: var(--erreur); border-color: var(--erreur); font-size: 1.05rem; margin-left: 4px; }
  .empty { color: var(--discret); text-align: center; padding: 16px 0; }

  /* ---- Statuts ---- */
  .badge { display: inline-block; white-space: nowrap; border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 700; }
  .badge.att { background: #fff1b8; color: #6b5200; }
  .badge.com { background: #d6f2de; color: #14612e; }
  .qtyv { font-weight: 800; margin-right: 8px; }

  /* ---- Suivi ---- */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip { border: 2px solid var(--trait); background: #fff; border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--nuit); border-color: var(--nuit); color: #fff; }
  .day { font-weight: 800; margin: 18px 0 6px; }
  .hint { color: var(--discret); font-size: 0.88rem; margin: 6px 0 0; }

  /* ---- Navigation basse ---- */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--trait); display: grid; grid-template-columns: 1fr 1fr; padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav button { min-height: 58px; border: 0; background: none; font-weight: 700; color: var(--discret); cursor: pointer; border-top: 4px solid transparent; }
  nav button[aria-selected="true"] { color: var(--nuit); border-top-color: var(--jaune); }

  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  .fatal { padding: 48px 20px; text-align: center; font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .banner { animation: pop 0.16s ease-out; }
    @keyframes pop { from { opacity: 0.3; transform: scale(0.98); } }
  }
</style>
</head>
<body>
<header class="head">
  <img id="logo" alt="" hidden>
  <div class="headtext">
    <div class="headtitle" id="title">Commandes</div>
    <div id="idband" hidden>
      <div class="headmeta">Atelier : <b id="g-name"></b></div>
      <div class="headmeta">Date : <span id="g-date"></span></div>
    </div>
  </div>
</header>

<main id="app" hidden>
  <div id="closed" class="banner closed" role="status" hidden><span class="ico">🕓</span><span id="closed-msg"></span></div>
  <div id="testmode" class="banner closed" role="status" hidden><span class="ico">🧪</span><span>Mode test : saisie ouverte sans limite d'heure.</span></div>
  <div id="error" class="banner error" role="alert" hidden><span class="ico">⚠</span><span id="error-msg"></span></div>

  <!-- ===== Onglet Commander ===== -->
  <section id="tab-order">
    <h2 id="h-lieu">1. LIEU DE LIVRAISON</h2>
    <div class="places" id="places" role="group" aria-labelledby="h-lieu">
      <div class="place on" id="p-atelier">
        <button type="button" class="place-btn" id="b-atelier" aria-pressed="true">
          <span class="ico-slot" id="ico-atelier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 4l9 6"/><path d="M5 9.5V20h14V9.5"/><path d="M8 13h8M8 16h8M8 19h8"/></svg></span>
          <span class="t" id="a-title">Atelier garage (SP)</span>
          <span class="s" id="a-sub"></span>
        </button>
      </div>
      <div class="place" id="p-client">
        <button type="button" class="place-btn" id="b-client" aria-pressed="false">
          <span class="ico-slot" id="ico-client"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h12v10H2z"/><path d="M14 9h4l4 4v3h-8z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg></span>
          <span class="t" id="c-title">Client utilisateur</span>
          <span class="s" id="c-sub"></span>
        </button>
        <select id="sel-client" aria-label="Client utilisateur"></select>
      </div>
    </div>

    <h2 id="h-pneu">2. CHOIX DU PNEUMATIQUE</h2>
    <div class="pick">
      <div class="pickbox" id="pickbox" role="combobox" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="pick-panel" aria-labelledby="h-pneu pick-name">
        <div class="name" id="pick-name"></div>
        <div class="tags" id="pick-tags"></div>
        <span class="chev">▾</span>
      </div>
      <select id="sel-cai" aria-hidden="true" tabindex="-1"></select>
      <div class="panel" id="pick-panel" hidden>
        <input id="pick-q" type="text" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Tapez la dimension, ex. 315 ou 315/70" aria-label="Filtrer par dimension">
        <div class="list" id="pick-list" role="listbox" aria-labelledby="h-pneu"></div>
      </div>
    </div>

    <div class="qty" role="group" aria-label="Quantité">
      <button type="button" id="q-minus" aria-label="Diminuer">−</button>
      <input id="q-val" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="1" aria-label="Quantité (saisie au clavier possible)">
      <button type="button" id="q-plus" aria-label="Augmenter">+</button>
    </div>

    <div id="dup" class="banner dup" role="alert" hidden>
      <span class="ico">⚠</span>
      <span id="dup-msg"></span>
    </div>

    <button type="button" class="add" id="add">AJOUTER À LA COMMANDE</button>
    <p class="why" id="why"></p>

    <h2>PANIER DU <span id="today"></span></h2>
    <div class="card" id="cart"></div>
  </section>

  <!-- ===== Onglet Suivi ===== -->
  <section id="tab-track" hidden>
    <h2>HISTORIQUE ET SUIVI</h2>
    <div class="chips" id="chips" role="group" aria-label="Filtrer par statut"></div>
    <p class="hint">60 derniers jours. « Commandée » s'affiche quand la commande a été passée sur BibServ.</p>
    <div id="history"></div>
  </section>
</main>

<div id="fatal" class="fatal" hidden></div>

<nav id="nav" hidden>
  <button type="button" id="n-order" role="tab" aria-selected="true">Commander</button>
  <button type="button" id="n-track" role="tab" aria-selected="false">Suivi</button>
</nav>

<script>
"use strict";

/* ========= À MODIFIER UNE SEULE FOIS ========= */
const API_URL = "https://script.google.com/macros/s/AKfycbxQIlVtLR0zkYZ1HLn7xmeD1sPilVzvUzIMT1_BcUU/dev";
const TITRE = "MICHELIN MS&S - Commandes";
const LOGO_URL = "logos/michelin-transparent.png"; // optionnel : adresse de votre propre logo (ex. "logo.png" envoyé dans le dépôt)
/* ============================================= */

const qs = new URLSearchParams(location.search);
const GARAGE = (qs.get("garage") || "").trim().toLowerCase();
const KEY = qs.get("k") || "";

const $ = (id) => document.getElementById(id);
const state = {
  cfg: null, orders: [], history: [], historyLoaded: false,
  open: true, test: false, today: "",
  tab: "order", mode: "atelier", qty: 1, filter: "En attente", busy: false,
};

const fr = (iso) => (iso || "").split("-").reverse().join("/");
const frStamp = (s) => { const [d, t] = (s || "").split(" "); return fr(d) + (t ? " à " + t.replace(":", "h") : ""); };

/** Deux statuts visibles : « Transmise » (envoyée à l'administrateur, pas encore commandée) s'affiche « En attente ». */
const uiStatus = (s) => (s === "Transmise" ? "En attente" : s);
const STATUS = {
  "En attente": { cls: "att", label: "🟡 En attente" },
  "Commandée": { cls: "com", label: "🟢 Commandée" },
};
function badge(statut) {
  const s = STATUS[uiStatus(statut)] || { cls: "att", label: uiStatus(statut) };
  const b = document.createElement("span");
  b.className = "badge " + s.cls;
  b.textContent = s.label;
  return b;
}

async function api(action, payload = {}) {
  let res;
  try {
    // Requête "simple" (sans en-tête personnalisé) : requise par Google Apps Script.
    res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, garage: GARAGE, key: KEY, ...payload }) });
  } catch {
    throw new Error("Pas de connexion. Vos lignes déjà ajoutées sont enregistrées ; réessayez dans un instant.");
  }
  const data = await res.json().catch(() => null);
  if (!data) throw new Error("Réponse inattendue du serveur. Réessayez dans un instant.");
  if (!data.ok) {
    const err = new Error(data.error || "Erreur inattendue.");
    err.status = data.status;
    throw err;
  }
  return data;
}

function showError(msg) {
  $("error-msg").textContent = msg || "";
  $("error").hidden = !msg;
}

/* ---------- Données dérivées ---------- */

/** N'accepte qu'une adresse https ou un fichier image du dépôt (ex. logos/dupont.png). */
function safeLogo(u) {
  u = (u || "").trim();
  if (/^https:\/\/[^\s"'<>]+$/i.test(u)) return u;
  if (/^[\w\-]+(\/[\w\-]+)*\.(png|jpe?g|svg|webp|gif)$/i.test(u)) return u;
  return "";
}

/** Affiche le logo s'il existe et se charge, sinon garde l'icône par défaut. */
function setIcon(slotId, logo) {
  const slot = $(slotId);
  const url = safeLogo(logo);
  const svg = slot.querySelector("svg");
  const old = slot.querySelector("img");
  if (old) old.remove();
  slot.classList.remove("has-logo");
  if (!url) { svg.removeAttribute("hidden"); return; }
  const img = document.createElement("img");
  img.className = "logo";
  img.alt = "";
  img.addEventListener("load", () => { svg.setAttribute("hidden", ""); slot.classList.add("has-logo"); });
  img.addEventListener("error", () => { img.remove(); slot.classList.remove("has-logo"); svg.removeAttribute("hidden"); });
  img.src = url;
  slot.append(img);
}

function clientLogo() {
  const c = clients().find((x) => x.id === $("sel-client").value);
  return c ? c.logo : "";
}

function atelier() { return state.cfg.lieux.find((p) => p.id === "atelier"); }
function clients() { return state.cfg.lieux.filter((p) => p.type === "client"); }
function currentPlace() {
  if (state.mode === "atelier") return atelier();
  return state.cfg.lieux.find((p) => p.id === $("sel-client").value);
}
function currentItem() { return state.cfg.catalogue.find((c) => String(c.ref) === $("sel-cai").value); }
/** Références proposées pour le lieu choisi : un client peut être limité à certains CAI (colonne de l'onglet Clients). */
function allowedItems() {
  const p = currentPlace();
  const list = p && Array.isArray(p.cais) ? p.cais.map(String) : null;
  const items = list ? state.cfg.catalogue.filter((c) => list.includes(String(c.ref))) : state.cfg.catalogue;
  // Ordre de présentation : Remix d'abord, puis Laurent, puis Neuf, puis le reste (ordre du catalogue conservé dans chaque famille).
  const rank = (f) => { const x = String(f || "").toLowerCase(); return x.includes("remix") ? 0 : x.includes("laurent") ? 1 : x.includes("neuf") ? 2 : 3; };
  return items.map((it, i) => [it, i]).sort((a, b) => rank(a[0].famille) - rank(b[0].famille) || a[1] - b[1]).map((x) => x[0]);
}

/** Doublon = même CAI, même lieu (code tiers), même jour. Uniquement quand un pneu est choisi. */
function isDuplicate() {
  const place = currentPlace();
  const item = currentItem();
  if (!place || !item) return false;
  return state.orders.some(
    (o) => o.date === state.today && (o.code_tiers || o.lieu) === (place.code_tiers || place.label) && String(o.ref || o.cai || o.designation) === String(item.ref),
  );
}

function editable(o) { return state.open && o.statut === "En attente" && !o.envoye && o.date === state.today; }

/* ---------- Rendu : formulaire ---------- */

function renderPick() {
  const item = currentItem();
  const name = $("pick-name");
  const tags = $("pick-tags");
  tags.replaceChildren();
  name.classList.toggle("placeholder", !item);
  if (!item) { name.textContent = "Choisir un pneu…"; return; }
  name.textContent = item.designation;
  if (item.recommande) {
    const r = document.createElement("span");
    r.className = "reco";
    r.textContent = "★ Recommandé";
    tags.append(r);
  }
}

function renderForm() {
  const a = atelier();
  const cl = clients();
  $("p-client").hidden = cl.length === 0;
  $("places").classList.toggle("single", cl.length === 0);
  $("a-title").textContent = a.label;
  $("a-sub").textContent = a.adresse || a.code_tiers;
  setIcon("ico-atelier", a.logo || state.cfg.garage.logo);
  setIcon("ico-client", clientLogo());
  // Le lieu de livraison affiché est le nom du client sélectionné (c'est aussi ce qui est enregistré et envoyé par email).
  const cur = clients().find((x) => x.id === $("sel-client").value);
  $("c-title").textContent = cur ? cur.label : "Client utilisateur";
  $("c-sub").textContent = cur ? (cur.adresse || cur.code_tiers) : "";
  $("p-atelier").classList.toggle("on", state.mode === "atelier");
  $("p-client").classList.toggle("on", state.mode === "client");
  $("b-atelier").setAttribute("aria-pressed", String(state.mode === "atelier"));
  $("b-client").setAttribute("aria-pressed", String(state.mode === "client"));

  renderPick();
  const qi = $("q-val");
  if (document.activeElement !== qi) qi.value = String(state.qty);

  const item = currentItem();
  const dup = isDuplicate();
  $("dup").hidden = !dup;
  if (dup) {
    $("dup-msg").textContent =
      `Vous avez déjà commandé ce pneu aujourd'hui pour ce lieu. ` +
      "Merci de modifier la quantité sur la commande existante ou de choisir une autre destination.";
  }

  $("add").disabled = state.busy || dup || !state.open || !item || state.qty < 1;
  $("why").textContent = !state.open ? "Saisie fermée" : dup ? "Impossible de valider (doublon)" : !item ? "Choisissez un pneu" : state.qty < 1 ? "Saisissez une quantité" : "";
}

function buildSelects() {
  const selClient = $("sel-client");
  selClient.replaceChildren();
  for (const p of clients()) selClient.append(new Option(p.label, p.id));

  buildCai();
}

/* ---------- Liste déroulante avec recherche par début de dimension ---------- */

const squash = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

/** « 315 » ou « 315-70 » ou « 315/70 » : ne garde que les pneus dont la désignation COMMENCE par la saisie. */
function filterItems(q) {
  const k = squash(q);
  const all = allowedItems();
  return k ? all.filter((it) => squash(it.designation).startsWith(k)) : all;
}

function renderPanel() {
  const list = $("pick-list");
  list.replaceChildren();
  // Regroupe par famille (Neuf / Remix / Laurent…) dans l'ordre d'apparition du catalogue.
  const order = [];
  const found = filterItems($("pick-q").value);
  for (const it of found) if (!order.includes(it.famille)) order.push(it.famille);
  const items = order.flatMap((f) => found.filter((it) => it.famille === f));
  if (items.length === 0) {
    const n = document.createElement("div");
    n.className = "none";
    n.textContent = `Aucun pneu ne commence par « ${$("pick-q").value.trim()} ».`;
    list.append(n);
    return;
  }
  let fam = null;
  for (const it of items) {
    if (it.famille !== fam) {
      fam = it.famille;
      const h = document.createElement("div");
      h.className = "grp";
      h.textContent = fam;
      list.append(h);
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.setAttribute("role", "option");
    b.dataset.ref = it.ref;
    const n = document.createElement("div");
    n.className = "n";
    n.textContent = it.designation;
    const m = document.createElement("div");
    m.className = "m";
    if (it.recommande) { const r = document.createElement("span"); r.className = "reco"; r.textContent = "★ Recommandé"; m.append(r); }
    b.append(n);
    if (it.recommande) b.append(m);
    list.append(b);
  }
}

function openPanel(prefill) {
  const p = $("pick-panel");
  $("pick-q").value = prefill || "";
  renderPanel();
  p.hidden = false;
  $("pickbox").setAttribute("aria-expanded", "true");
  $("pick-q").focus();
}
function closePanel(refocus) {
  $("pick-panel").hidden = true;
  $("pickbox").setAttribute("aria-expanded", "false");
  if (refocus) $("pickbox").focus();
}
function choose(ref) {
  const sel = $("sel-cai");
  sel.value = ref;
  sel.dispatchEvent(new Event("change", { bubbles: true }));
  closePanel(true);
}

function initPicker() {
  const box = $("pickbox");
  box.addEventListener("click", () => ($("pick-panel").hidden ? openPanel("") : closePanel(false)));
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") { e.preventDefault(); openPanel(""); }
    else if (e.key.length === 1 && /[a-z0-9]/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openPanel(e.key); }
  });
  $("pick-q").addEventListener("input", renderPanel);
  $("pick-q").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closePanel(true); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const first = $("pick-list").querySelector(".opt:not([disabled])");
      if (first) choose(first.dataset.ref);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      const first = $("pick-list").querySelector(".opt:not([disabled])");
      if (first) first.focus();
    }
  });
  $("pick-list").addEventListener("click", (e) => {
    const b = e.target.closest(".opt");
    if (b && !b.disabled) choose(b.dataset.ref);
  });
  $("pick-list").addEventListener("keydown", (e) => {
    const opts = [...$("pick-list").querySelectorAll(".opt:not([disabled])")];
    const i = opts.indexOf(document.activeElement);
    if (e.key === "ArrowDown" && i < opts.length - 1) { e.preventDefault(); opts[i + 1].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); (i > 0 ? opts[i - 1] : $("pick-q")).focus(); }
    else if (e.key === "Escape") { e.preventDefault(); closePanel(true); }
  });
  document.addEventListener("click", (e) => {
    if (!$("pick-panel").hidden && !e.target.closest(".pick")) closePanel(false);
  });
}

function buildCai() {
  const selCai = $("sel-cai");
  const keep = selCai.value;
  selCai.replaceChildren(new Option("Choisir un pneu…", ""));
  const groups = new Map();
  for (const item of allowedItems()) {
    if (!groups.has(item.famille)) {
      const g = document.createElement("optgroup");
      g.label = item.famille;
      groups.set(item.famille, g);
      selCai.append(g);
    }
    const text = `${item.recommande ? "★ " : ""}${item.designation}`;
    const opt = new Option(text, item.ref);
    groups.get(item.famille).append(opt);
  }
  selCai.value = [...selCai.options].some((o) => o.value === keep && !o.disabled) ? keep : "";
  if (!$("pick-panel").hidden) renderPanel();
}

/* ---------- Rendu : panier ---------- */

function miniBtn(text, label, onClick, disabled, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.setAttribute("aria-label", label);
  b.disabled = disabled || state.busy;
  if (cls) b.className = cls;
  b.addEventListener("click", onClick);
  return b;
}
function out(n) { const o = document.createElement("output"); o.textContent = String(n); return o; }

function renderCart() {
  const box = $("cart");
  box.replaceChildren();
  $("today").textContent = fr(state.today);

  if (state.orders.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Panier vide. Choisissez un pneu ci-dessus.";
    box.append(p);
    return;
  }

  const byPlace = new Map();
  for (const o of state.orders) {
    const pk = o.code_tiers || o.lieu;
    if (!byPlace.has(pk)) byPlace.set(pk, { label: o.lieu, items: [] });
    byPlace.get(pk).items.push(o);
  }
  for (const { label, items } of byPlace.values()) {
    const t = document.createElement("div");
    t.className = "lieu-title";
    t.textContent = label;
    box.append(t);
    for (const o of items) {
      const row = document.createElement("div");
      row.className = "line";
      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = o.designation;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [o.date !== state.today ? `du ${fr(o.date)}` : "", o.adresse || ""].filter(Boolean).join(" · ");
      left.append(name, meta);

      const right = document.createElement("div");
      right.className = "mini";
      if (editable(o)) {
        right.append(
          miniBtn("−", `Diminuer ${o.designation}`, () => changeQty(o, o.quantite - 1), o.quantite <= 1),
          out(o.quantite),
          miniBtn("+", `Augmenter ${o.designation}`, () => changeQty(o, o.quantite + 1), false),
          miniBtn("✕", `Supprimer ${o.designation}`, () => removeLine(o), false, "del"),
        );
      } else {
        const q = document.createElement("span");
        q.className = "qtyv";
        q.textContent = `×${o.quantite}`;
        right.append(q, badge(o.statut));
      }
      row.append(left, right);
      box.append(row);
    }
  }
}

/* ---------- Rendu : suivi ---------- */

const FILTERS = [["En attente", "En attente"], ["Commandée", "Commandée"]];

function renderChips() {
  const box = $("chips");
  box.replaceChildren();
  for (const [key, label] of FILTERS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(state.filter === key));
    b.addEventListener("click", () => { state.filter = key; renderChips(); renderHistory(); });
    box.append(b);
  }
}

function renderHistory() {
  const box = $("history");
  box.replaceChildren();
  const list = state.history.filter((o) => uiStatus(o.statut) === state.filter);
  if (!state.historyLoaded) { box.append(emptyP("Chargement…")); return; }
  if (list.length === 0) { box.append(emptyP("Aucune commande à afficher.")); return; }

  const byDay = new Map();
  for (const o of list) {
    if (!byDay.has(o.date)) byDay.set(o.date, []);
    byDay.get(o.date).push(o);
  }
  for (const [day, items] of byDay) {
    const h = document.createElement("div");
    h.className = "day";
    h.textContent = day === state.today ? `Aujourd'hui · ${fr(day)}` : fr(day);
    const card = document.createElement("div");
    card.className = "card";
    for (const o of items) {
      const row = document.createElement("div");
      row.className = "line";
      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = o.designation;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [o.lieu, o.adresse || "", o.valide_le ? `commandée le ${frStamp(o.valide_le)}` : ""].filter(Boolean).join(" · ");
      left.append(name, meta);
      if (o.livraison) {
        const lv = document.createElement("div");
        lv.className = "livr";
        lv.textContent = `🚚 Livraison prévue le ${fr(o.livraison)}`;
        left.append(lv);
      }
      const right = document.createElement("div");
      const q = document.createElement("span");
      q.className = "qtyv";
      q.textContent = `×${o.quantite}`;
      right.append(q, badge(o.statut));
      row.append(left, right);
      card.append(row);
    }
    box.append(h, card);
  }
}
function emptyP(t) { const p = document.createElement("p"); p.className = "empty"; p.textContent = t; return p; }

/* ---------- Rendu global ---------- */

function renderAll() {
  $("testmode").hidden = !state.test;
  const closed = !state.open;
  $("closed").hidden = !closed;
  if (closed) $("closed-msg").textContent = state.cfg.message || "Saisie fermée.";
  $("g-date").textContent = fr(state.today);
  renderForm();
  renderCart();
  if (state.tab === "track") renderHistory();
}

function setTab(tab) {
  state.tab = tab;
  $("tab-order").hidden = tab !== "order";
  $("tab-track").hidden = tab !== "track";
  $("n-order").setAttribute("aria-selected", String(tab === "order"));
  $("n-track").setAttribute("aria-selected", String(tab === "track"));
  window.scrollTo(0, 0);
  if (tab === "track") { renderChips(); renderHistory(); loadHistory(); }
}

/* ---------- Actions ---------- */

async function guarded(fn) {
  if (state.busy) return;
  state.busy = true;
  showError("");
  renderAll();
  try {
    await fn();
  } catch (e) {
    showError(e.message);
    if (e.status === 409) await refresh(true);
  } finally {
    state.busy = false;
    renderAll();
  }
}

async function refresh(silent) {
  try {
    const data = await api("orders");
    state.orders = data.orders;
    state.today = data.today;
    state.open = data.open;
    state.test = !!data.test;
    if (!data.open && !state.cfg.message) state.cfg.message = "Clôture passée. Réouverture au prochain jour ouvré.";
    renderAll();
  } catch (e) {
    if (!silent) showError(e.message);
  }
}

async function loadHistory() {
  try {
    const data = await api("history");
    state.history = data.orders;
    state.historyLoaded = true;
    if (state.tab === "track") renderHistory();
  } catch (e) {
    state.historyLoaded = true;
    showError(e.message);
    renderHistory();
  }
}

function addLine() {
  return guarded(async () => {
    const place = currentPlace();
    const item = currentItem();
    if (!place) throw new Error("Choisissez un lieu de livraison.");
    if (!item) throw new Error("Choisissez un pneu.");
    if (state.qty < 1) throw new Error("Saisissez une quantité (1 à 999).");
    const data = await api("add", { lieu_id: place.id, ref: item.ref, quantite: state.qty });
    state.orders.unshift(data.order);
    // Remise à zéro : le pneu qu'on vient d'ajouter n'est plus sélectionné,
    // donc le bandeau de doublon n'apparaît que si on le rechoisit.
    $("sel-cai").value = "";
    state.qty = 1;
    $("q-val").value = "1";
    state.historyLoaded = false;
  });
}

function changeQty(order, q) {
  return guarded(async () => {
    const data = await api("update", { id: order.id, quantite: q });
    Object.assign(order, data.order);
    state.historyLoaded = false;
  });
}

function removeLine(order) {
  if (!confirm(`Supprimer « ${order.designation} » du panier ?`)) return;
  return guarded(async () => {
    await api("delete", { id: order.id });
    state.orders = state.orders.filter((o) => o.id !== order.id);
    state.historyLoaded = false;
  });
}

/* ---------- Démarrage ---------- */

function fatal(msg) {
  $("app").hidden = true;
  $("nav").hidden = true;
  const f = $("fatal");
  f.hidden = false;
  f.textContent = msg;
}

async function init() {
  $("title").textContent = TITRE;
  if (LOGO_URL) {
    const lg = $("logo");
    lg.addEventListener("load", () => { lg.hidden = false; });
    lg.addEventListener("error", () => { lg.hidden = true; });
    lg.src = LOGO_URL;
  }
  if (API_URL.startsWith("COLLEZ")) {
    return fatal("Page non configurée : l'administrateur doit renseigner l'adresse de l'application Google dans index.html.");
  }
  if (!KEY) {
    return fatal("Lien incomplet. Utilisez le lien complet fourni par l'administrateur.");
  }
  try {
    state.cfg = await api("config");
  } catch (e) {
    return fatal(e.message);
  }
  state.today = state.cfg.today;
  state.open = state.cfg.open;
  state.test = !!state.cfg.test;
  $("g-name").textContent = state.cfg.garage.nom;
  document.title = `${state.cfg.garage.nom} – Commandes`;
  $("idband").hidden = false;
  buildSelects();
  $("app").hidden = false;
  $("nav").hidden = false;

  const pickClient = () => { state.mode = "client"; buildCai(); renderForm(); };
  $("b-atelier").addEventListener("click", () => { state.mode = "atelier"; buildCai(); renderForm(); });
  $("b-client").addEventListener("click", pickClient);
  $("sel-client").addEventListener("focus", pickClient);
  $("sel-client").addEventListener("change", pickClient);
  $("sel-cai").addEventListener("change", renderForm);
  initPicker();
  const qi = $("q-val");
  const setQty = (n) => { state.qty = n; qi.value = String(n); renderForm(); };
  $("q-minus").addEventListener("click", () => setQty(Math.max(1, (state.qty || 1) - 1)));
  $("q-plus").addEventListener("click", () => setQty(Math.min(999, (state.qty || 0) + 1)));
  // Saisie au clavier : chiffres seulement, 1 à 999 ; champ vide = bouton Ajouter désactivé, remis à 1 en quittant le champ.
  qi.addEventListener("input", () => {
    const d = qi.value.replace(/\D/g, "").slice(0, 3);
    if (d !== qi.value) qi.value = d;
    const v = parseInt(d, 10);
    state.qty = Number.isFinite(v) ? Math.min(v, 999) : 0;
    renderForm();
  });
  qi.addEventListener("focus", () => qi.select());
  qi.addEventListener("blur", () => { if (state.qty < 1) state.qty = 1; qi.value = String(state.qty); renderForm(); });
  qi.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); qi.blur(); } });
  $("add").addEventListener("click", addLine);
  $("n-order").addEventListener("click", () => setTab("order"));
  $("n-track").addEventListener("click", () => setTab("track"));

  await refresh();
  setInterval(() => { refresh(true); if (state.tab === "track") loadHistory(); }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { refresh(true); if (state.tab === "track") loadHistory(); }
  });
}

init();
</script>
</body>
